# CI for your Skill Atlas repository: the typecheck, the tests and the CLI itself, on every push
# and pull request, on a clean machine. A pull request is ready when this is green.
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The real CLI on the fixture repository, as a user would run it: it must exit 0.
      - name: Smoke test
        run: |
          ./skill-atlas help
          ./skill-atlas scan ./fixture
  # The web view's screenshots, made the way they are made everywhere: `npm run test:visual`, the
  # Playwright image in Docker, here on a Linux runner as on a Linux machine. On a failure, the report has
  # each screenshot expected, actual and their difference.
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: npm run test:visual
      # What the container wrote belongs to the user who ran it, not to root.
      - name: No files owned by root
        if: always()
        run: |
          owned=$(find . -path ./.git -prune -o ! -user "$(id -u)" -print)
          if [ -n "$owned" ]; then echo "Owned by another user:"; echo "$owned"; exit 1; fi
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-report
          path: |
            playwright-report/
            test-results/
